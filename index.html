<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Jefe Premium Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --black: #0a0a0a;
            --dark-gray: #1a1a1a;
            --medium-gray: #2a2a2a;
            --light-gray: #888;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* WELCOME SCREEN */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 50%, var(--black) 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .welcome-logo {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            animation: fadeInUp 0.8s ease;
        }

        .welcome-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.5));
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
            text-align: center;
            margin-bottom: 10px;
            animation: fadeInUp 0.8s ease 0.2s both;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--light-gray);
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease 0.4s both;
            line-height: 1.5;
        }

        .welcome-section {
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .welcome-section-title {
            font-size: 14px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }

        .language-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .lang-btn {
            background: var(--medium-gray);
            border: 2px solid transparent;
            color: var(--white);
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .lang-btn:hover {
            background: var(--dark-gray);
            border-color: var(--gold);
        }

        .lang-btn.active {
            background: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        .currency-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .currency-btn {
            background: var(--medium-gray);
            border: 2px solid transparent;
            color: var(--white);
            padding: 12px 8px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .currency-btn:hover {
            background: var(--dark-gray);
            border-color: var(--gold);
        }

        .currency-btn.active {
            background: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        .enter-shop-btn {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--black);
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
            animation: fadeInUp 0.8s ease 0.8s both;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .enter-shop-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        }

        .enter-shop-btn:active {
            transform: translateY(-1px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MAIN APP STYLES */
        .app-container {
            display: none;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .app-container.visible {
            display: block;
        }

        /* Top Bar */
        .top-bar {
            background: linear-gradient(180deg, var(--dark-gray) 0%, transparent 100%);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-small {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-small img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .logo-small span {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .currency-select {
            background: var(--medium-gray);
            border: 1px solid var(--gold);
            color: var(--white);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        .cart-btn {
            background: var(--gold);
            border: none;
            color: var(--black);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: 18px;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4444;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            background: var(--medium-gray);
            border: 2px solid transparent;
            color: var(--white);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .category-tab:hover {
            background: var(--dark-gray);
            border-color: var(--gold);
        }

        .category-tab.active {
            background: var(--gold);
            color: var(--black);
            border-color: var(--gold);
        }

        /* Products Grid */
        .products-section {
            padding: 20px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .product-card {
            background: var(--dark-gray);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--medium-gray);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .product-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background: var(--medium-gray);
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--white);
            line-height: 1.3;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }

        .add-to-cart {
            width: 100%;
            background: var(--gold);
            border: none;
            color: var(--black);
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-to-cart:hover {
            background: var(--gold-light);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--dark-gray);
            border-top: 1px solid var(--medium-gray);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 5px 20px;
            cursor: pointer;
            color: var(--light-gray);
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--gold);
        }

        .nav-item span {
            font-size: 20px;
        }

        .nav-item label {
            font-size: 11px;
            font-weight: 500;
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }

        .cart-modal.visible {
            display: flex;
        }

        .cart-header {
            background: var(--dark-gray);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--medium-gray);
        }

        .cart-header h2 {
            color: var(--gold);
            font-size: 20px;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--white);
            font-size: 24px;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            background: var(--dark-gray);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: var(--gold);
            font-weight: 700;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .qty-btn {
            background: var(--medium-gray);
            border: none;
            color: var(--white);
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .remove-item {
            background: #ff4444;
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .cart-footer {
            background: var(--dark-gray);
            padding: 20px;
            border-top: 1px solid var(--medium-gray);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--gold);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            border: none;
            color: var(--black);
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            color: var(--light-gray);
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- WELCOME SCREEN -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">
            <img src="https://files.catbox.moe/logo.png" alt="El Jefe Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>'">
        </div>
        <h1 class="welcome-title" id="welcomeTitle">Welcome to El Jefe Shop</h1>
        <p class="welcome-subtitle" id="welcomeSubtitle">Please select your Language and Currency</p>
        
        <div class="welcome-section">
            <div class="welcome-section-title" id="langTitle">Language</div>
            <div class="language-selector">
                <button class="lang-btn active" data-lang="EN" onclick="selectLanguage('EN')">EN</button>
                <button class="lang-btn" data-lang="IT" onclick="selectLanguage('IT')">IT</button>
                <button class="lang-btn" data-lang="FR" onclick="selectLanguage('FR')">FR</button>
                <button class="lang-btn" data-lang="DE" onclick="selectLanguage('DE')">DE</button>
                <button class="lang-btn" data-lang="RU" onclick="selectLanguage('RU')">RU</button>
            </div>
        </div>

        <div class="welcome-section">
            <div class="welcome-section-title" id="currTitle">Currency</div>
            <div class="currency-selector">
                <button class="currency-btn active" data-currency="EUR" onclick="selectCurrency('EUR')">EUR</button>
                <button class="currency-btn" data-currency="USD" onclick="selectCurrency('USD')">USD</button>
                <button class="currency-btn" data-currency="GBP" onclick="selectCurrency('GBP')">GBP</button>
                <button class="currency-btn" data-currency="JPY" onclick="selectCurrency('JPY')">JPY</button>
                <button class="currency-btn" data-currency="RUB" onclick="selectCurrency('RUB')">RUB</button>
            </div>
        </div>

        <button class="enter-shop-btn" id="enterBtn" onclick="enterShop()">ENTER SHOP</button>
    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="appContainer">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-controls">
                <div class="logo-small">
                    <img src="https://files.catbox.moe/logo.png" alt="El Jefe" onerror="this.style.display='none'">
                    <span>EL JEFE</span>
                </div>
                <div class="header-actions">
                    <select class="currency-select" id="headerCurrency" onchange="changeCurrency(this.value)">
                        <option value="EUR">EUR €</option>
                        <option value="USD">USD $</option>
                        <option value="GBP">GBP £</option>
                        <option value="JPY">JPY ¥</option>
                        <option value="RUB">RUB ₽</option>
                    </select>
                    <button class="cart-btn" onclick="openCart()">
                        🛒
                        <span class="cart-count" id="cartCount">0</span>
                    </button>
                </div>
            </div>
            
            <div class="category-tabs">
                <button class="category-tab active" onclick="filterCategory('all', this)">All</button>
                <button class="category-tab" onclick="filterCategory('cocaine', this)">❄️ Cocaine</button>
                <button class="category-tab" onclick="filterCategory('weed', this)">🌿 Weed</button>
                <button class="category-tab" onclick="filterCategory('pills', this)">💊 Pills</button>
                <button class="category-tab" onclick="filterCategory('hash', this)">🟫 Hash</button>
                <button class="category-tab" onclick="filterCategory('shrooms', this)">🍄 Shrooms</button>
                <button class="category-tab" onclick="filterCategory('lsd', this)">🧬 LSD</button>
                <button class="category-tab" onclick="filterCategory('mdma', this)">✨ MDMA</button>
                <button class="category-tab" onclick="filterCategory('ketamine', this)">🔮 Ketamine</button>
                <button class="category-tab" onclick="filterCategory('heroin', this)">🌙 Heroin</button>
                <button class="category-tab" onclick="filterCategory('meth', this)">💎 Meth</button>
                <button class="category-tab" onclick="filterCategory('crack', this)">⚡ Crack</button>
            </div>
        </div>

        <!-- Products -->
        <div class="products-section">
            <h2 class="section-title" id="productsTitle">Premium Products</h2>
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="showSection('shop', this)">
                <span>🏪</span>
                <label>Shop</label>
            </div>
            <div class="nav-item" onclick="showSection('orders', this)">
                <span>📦</span>
                <label>Orders</label>
            </div>
            <div class="nav-item" onclick="showSection('profile', this)">
                <span>👤</span>
                <label>Profile</label>
            </div>
            <div class="nav-item" onclick="showSection('support', this)">
                <span>💬</span>
                <label>Support</label>
            </div>
        </nav>
    </div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h2>🛒 Your Cart</h2>
            <button class="close-cart" onclick="closeCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="empty-cart">
                <div class="empty-cart-icon">🛒</div>
                <p>Your cart is empty</p>
            </div>
        </div>
        <div class="cart-footer" id="cartFooter" style="display: none;">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">€0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

            { id: 11, name: "Afghan Heroin", category: "heroin", price: 70, image: "https://files.catbox.moe/heroin1.jpg", desc: "Pure #4 heroin" },
            { id: 12, name: "Blue Meth", category: "meth", price: 50, image: "https://files.catbox.moe/meth1.jpg", desc: "Crystal clear" },
            { id: 13, name: "Crack Rocks", category: "crack", price: 45, image: "https://files.catbox.moe/crack1.jpg", desc: "Ready to smoke" },
            { id: 14, name: "XTC Pills", category: "pills", price: 20, image: "https://files.catbox.moe/pills1.jpg", desc: "250mg MDMA" },
            { id: 15, name: "Oxycodone", category: "pills", price: 30, image: "https://files.catbox.moe/pills2.jpg", desc: "80mg OC" }
        ];

        // Language selection
        function selectLanguage(lang) {
            currentLang = lang;
            
            // Update buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            
            // Update welcome text
            const t = translations[lang];
            document.getElementById('welcomeTitle').textContent = t.welcome;
            document.getElementById('welcomeSubtitle').textContent = t.subtitle;
            document.getElementById('langTitle').textContent = t.language;
            document.getElementById('currTitle').textContent = t.currency;
            document.getElementById('enterBtn').textContent = t.enter;
        }

        // Currency selection
        function selectCurrency(curr) {
            currentCurrency = curr;
            
            document.querySelectorAll('.currency-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.currency === curr);
            });
        }

        // Enter shop
        function enterShop() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.add('visible');
            
            // Set header currency
            document.getElementById('headerCurrency').value = currentCurrency;
            
            // Update products title
            document.getElementById('productsTitle').textContent = translations[currentLang].products;
            
            // Load products
            renderProducts();
            
            // Notify Telegram
            tg.HapticFeedback.impactOccurred('medium');
        }

        // Change currency from header
        function changeCurrency(curr) {
            currentCurrency = curr;
            renderProducts();
            updateCart();
        }

        // Format price
        function formatPrice(eurPrice) {
            const converted = (eurPrice * rates[currentCurrency]).toFixed(2);
            return `${symbols[currentCurrency]}${converted}`;
        }

        // Render products
        function renderProducts(category = 'all') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filtered = category === 'all' 
                ? products 
                : products.filter(p => p.category === category);
            
            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" class="product-image" alt="${product.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 150%22><rect fill=%22%23333%22 width=%22200%22 height=%22150%22/><text fill=%22%23D4AF37%22 y=%2280%22 x=%22100%22 text-anchor=%22middle%22>${product.name}</text></svg>'">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${formatPrice(product.price)}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Filter category
        function filterCategory(cat, btn) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCart();
            tg.HapticFeedback.impactOccurred('light');
        }

        // Update cart display
        function updateCart() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
            
            const cartItems = document.getElementById('cartItems');
            const cartFooter = document.getElementById('cartFooter');
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <p>${translations[currentLang].empty}</p>
                    </div>
                `;
                cartFooter.style.display = 'none';
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <img src="${item.image}" class="cart-item-image" alt="${item.name}">
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">${formatPrice(item.price)}</div>
                            <div class="quantity-controls">
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                                <button class="remove-item" onclick="removeFromCart(${item.id})">Remove</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                document.getElementById('cartTotal').textContent = formatPrice(total);
                cartFooter.style.display = 'block';
            }
        }

        // Update quantity
        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    removeFromCart(productId);
                } else {
                    updateCart();
                }
            }
        }

        // Remove from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Open cart
        function openCart() {
            document.getElementById('cartModal').classList.add('visible');
        }

        // Close cart
        function closeCart() {
            document.getElementById('cartModal').classList.remove('visible');
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) return;
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const items = cart.map(item => `${item.name} x${item.quantity}`).join(', ');
            
            tg.sendData(JSON.stringify({
                action: 'checkout',
                items: cart,
                total: total,
                currency: currentCurrency
            }));
            
            tg.close();
        }

        // Navigation
        function showSection(section, btn) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Welcome screen is shown by default
        });
    </script>
</body>
</html>
